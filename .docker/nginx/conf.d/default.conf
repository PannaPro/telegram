server {
    listen 80;
    server_name paketagame.ru www.paketagame.ru;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name paketagame.ru www.paketagame.ru;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    root /app/public;
    index index.php index.html;

    # --- Telegram webhook ---
    location = /webhook {
        access_log /var/log/nginx/webhook.log combined;

        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param HTTPS on;

        # Принудительно разрешаем только POST
        if ($request_method !~ ^(POST)$ ) {
            return 405;
        }
    }

    # --- Главный index.php для Symfony ---
     location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param HTTPS on;
    }

    # --- Все остальные роуты Symfony ---
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # --- Статика ---
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Скрытые файлы ---
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --- Больше никакие .php напрямую ---
    location ~ \.php$ {
        return 404;
    }
}

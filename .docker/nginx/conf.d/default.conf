upstream php-fpm {
    server app:9000;
}

server {
    listen 80;
    server_name paketagame.ru www.paketagame.ru;

    # Логи
    access_log /var/log/nginx/paketagame.ru.access.log;
    error_log /var/log/nginx/paketagame.ru.error.log;

    root /app/public;
    index index.php index.html;

    # Статика
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API и все остальное
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # PHP обработчик
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php-fpm;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Важно для вебхуков
        fastcgi_read_timeout 300s;
        fastcgi_buffering off;

        include fastcgi_params;

        # Заголовки для приложения
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    }

    # Защита скрытых файлов
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    # Запрет прямого доступа к .php файлам
    location ~ \.php$ {
        return 404;
    }
}

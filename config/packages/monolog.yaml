monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - webhook
        - webhook_payload
        - action
        - event_scheduler

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            deprecation:
                type: stream
                path: "%kernel.logs_dir%/deprecations.log"
                channels: ["deprecation"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
            webhook:
                type: rotating_file
                path: "%kernel.logs_dir%/webhook.log"
                level: debug
                channels: [ 'webhook' ]
                max_files: 1
            webhook_payload:
                type: rotating_file
                path: "%kernel.logs_dir%/webhook_payload.log"
                level: debug
                channels: [ 'webhook_payload' ]
                max_files: 1
            action:
                type: rotating_file
                path: "%kernel.logs_dir%/action.log"
                level: debug
                channels: [ 'action' ]
                max_files: 1
            event_scheduler:
                type: rotating_file
                path: "%kernel.logs_dir%/event_scheduler.log"
                level: debug
                channels: [ 'event_scheduler' ]
                max_files: 1

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
            webhook:
                type: rotating_file
                path: "%kernel.logs_dir%/webhook.log"
                level: debug
                channels: [ 'webhook' ]
                max_files: 7
            webhook_payload:
                type: rotating_file
                path: "%kernel.logs_dir%/webhook_payload.log"
                level: debug
                channels: [ 'webhook_payload' ]
                max_files: 7
            action:
                type: rotating_file
                path: "%kernel.logs_dir%/action.log"
                level: debug
                channels: [ 'action' ]
                max_files: 7
            event_scheduler:
                type: rotating_file
                path: "%kernel.logs_dir%/event_scheduler.log"
                level: info
                channels: [ 'event_scheduler' ]
                max_files: 7
